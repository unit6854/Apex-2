name: Theme check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Shopify CLI needs Node 22+; it calls enableCompileCache, added in 22.1.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      # Dawn ships with a handful of its own warnings, so only real errors
      # should break the build.
      - name: Run theme check
        run: shopify theme check --fail-level error
